# main に入った変更を本番へ反映する。
# 必要な Secrets / Variables は docs/setup.md を参照。未設定の間は各ジョブがスキップされる。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  supabase:
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: プロジェクトに接続
        run: npx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: マイグレーションを適用
        run: npx supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Edge Function の Secrets を設定
        run: |
          npx supabase secrets set --project-ref "$PROJECT_REF" \
            VAPID_PUBLIC_KEY="${{ vars.VITE_VAPID_PUBLIC_KEY }}" \
            VAPID_PRIVATE_KEY="${{ secrets.VAPID_PRIVATE_KEY }}" \
            VAPID_SUBJECT="${{ vars.VAPID_SUBJECT }}" \
            CRON_SECRET="${{ secrets.CRON_SECRET }}"
      - name: Edge Function をデプロイ
        run: npx supabase functions deploy --project-ref "$PROJECT_REF"

  web:
    if: vars.VITE_SUPABASE_URL != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ビルド
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - name: Cloudflare Pages のプロジェクトを用意（初回のみ作成）
        run: npx wrangler@4 pages project create swim-d-work --production-branch main || true
      - name: Cloudflare Pages にデプロイ
        run: npx wrangler@4 pages deploy dist --project-name swim-d-work --branch main

  cron-worker:
    if: vars.VITE_SUPABASE_URL != ''
    needs: supabase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/nightly-cron
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker をデプロイ
        run: npx wrangler@4 deploy
      - name: Worker の Secrets を設定
        run: |
          echo "${{ vars.VITE_SUPABASE_URL }}" | npx wrangler@4 secret put SUPABASE_URL
          echo "${{ secrets.CRON_SECRET }}" | npx wrangler@4 secret put CRON_SECRET
