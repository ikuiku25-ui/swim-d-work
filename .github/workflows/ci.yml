name: CI

on:
  pull_request:
  push:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check */index.ts
      - run: deno task test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ローカルのデータベースを起動（マイグレーションと seed を適用）
        run: npx supabase db start
      - name: RLS とトリガーのテスト（pgTAP）
        run: npx supabase test db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Edge Functions 用のテスト専用の鍵を作る（本番の鍵は使わない）
        run: |
          KEYS=$(npx --yes web-push@3.6.7 generate-vapid-keys --json)
          PUB=$(node -e "console.log(JSON.parse(process.argv[1]).publicKey)" "$KEYS")
          PRIV=$(node -e "console.log(JSON.parse(process.argv[1]).privateKey)" "$KEYS")
          printf 'VAPID_PUBLIC_KEY=%s\nVAPID_PRIVATE_KEY=%s\nVAPID_SUBJECT=mailto:ci@example.com\nCRON_SECRET=ci-secret\n' "$PUB" "$PRIV" > supabase/functions/.env
          echo "VAPID_PUBLIC=$PUB" >> "$GITHUB_ENV"
      - name: ローカルの Supabase を起動（マイグレーションと seed を適用）
        run: npx supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,logflare,vector,supavisor
      - name: Edge Functions を起動
        run: |
          nohup npx supabase functions serve --env-file supabase/functions/.env > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/flush-notifications -d '{}' || true)
            [ "$code" = "401" ] && break
            sleep 2
          done
      - name: フロントエンドの環境変数
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\nVITE_VAPID_PUBLIC_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" "$VAPID_PUBLIC" > .env.local
      - run: npx playwright install --with-deps chromium
      - name: 画面操作の通しテスト
        run: npx playwright test
      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            functions.log
          retention-days: 7
