<h2>SWIM D-work ログインコード</h2>
<p>アプリのログイン画面で、次のコードを入力してください。</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
<p>コードの有効期限は1時間です。期限が切れたら、ログイン画面の「コードを再送する」を押してください。</p>
<hr>
<p><b>はじめて使う方へ</b></p>
<ol>
  <li>iPhone の Safari で <a href="{{ .SiteURL }}">{{ .SiteURL }}</a> を開く</li>
  <li>共有ボタン →「ホーム画面に追加」</li>
  <li>ホーム画面の「D-work」から開き、このメールアドレスと上のコードでログインする</li>
</ol>
<p>このメールに心当たりがない場合は、何もせずに削除してください。</p>
